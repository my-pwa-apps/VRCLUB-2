services:
  - type: web
    name: vrclub
    runtime: node
    repo: https://github.com/my-pwa-apps/VRCLUB-2
    branch: main
    region: oregon
    plan: free
    buildCommand: echo "No build step needed"
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    autoDeploy: true

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Immersive hyperrealistic VR nightclub experience with professional lighting, DJ booth, and audio-reactive visuals for Meta Quest 3S">
    <meta name="theme-color" content="#000000">
    
    <!-- Performance Optimization Hints -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="preconnect" href="https://cdn.babylonjs.com" crossorigin>
    <link rel="preconnect" href="https://dl.polyhaven.org" crossorigin>
    <link rel="dns-prefetch" href="https://unpkg.com">
    
    <title>VR Club - Hyperrealistic Virtual Nightclub Experience</title>
    
    <!-- Inline SVG Favicon (prevents 404 error) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎧</text></svg>">
    
    <!-- Preload Critical CSS -->
    <link rel="preload" href="css/styles.css" as="style">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Noise Overlay -->
    <div class="noise-overlay"></div>

    <!-- Splash Screen -->
    <div id="splashScreen">
        
        <div class="splash-content">
            <div class="splash-logo">🎧</div>
            <div class="splash-title">VR CLUB</div>
            <div class="splash-subtitle">◆ Immersive Virtual Nightclub Experience ◆</div>
            
            <button class="splash-button" id="enterClubBtn">
                ▶ ENTER CLUB
            </button>
            
            <div class="splash-options">
                <div class="splash-input-group">
                    <label class="splash-label">◇ Your Name (Optional)</label>
                    <input type="text" class="splash-input" id="splashUsername" placeholder="DJ Guest" maxlength="20">
                </div>
            </div>
            
            <div class="splash-loading" id="splashLoading">
                <div class="splash-spinner"></div>
                Loading club experience...
            </div>
        </div>
    </div>
    
    <canvas id="canvas" class="hidden"></canvas>
    
    <!-- VJ Toggle Button -->
    <button id="vjToggle" title="VJ Controls">🎛️</button>
    
    <!-- VJ Control Menu -->
    <div id="vjMenu" class="hidden">
        <div class="vj-header">
            <div class="vj-title">
                <span>🎛️</span>
                <span>VJ Controls</span>
            </div>
            <div class="vj-controls">
                <button class="vj-btn-icon" id="vjMinimize" title="Minimize">−</button>
                <button class="vj-btn-icon" id="vjClose" title="Close">×</button>
            </div>
        </div>
        
        <div class="vj-content">
            <!-- Main Toggles -->
            <div class="vj-section">
                <div class="vj-section-title">💡 Main Controls</div>
                <div class="vj-button-grid">
                    <button class="vj-button active" data-control="lightsActive">LIGHTS</button>
                    <button class="vj-button" data-control="lasersActive">LASERS</button>
                    <button class="vj-button active" data-control="ledWallActive">LED WALL</button>
                    <button class="vj-button active" data-control="strobesActive">STROBES</button>
                    <button class="vj-button" data-control="mirrorBallActive">MIRROR BALL</button>
                    <button class="vj-button" data-control="laserSheetActive">LASER SHEET</button>
                    <button class="vj-button" data-control="smokeActive">SMOKE</button>
                </div>
            </div>
            
            <!-- Spotlight Controls -->
            <div class="vj-section">
                <div class="vj-section-title">🔦 Spotlight Settings</div>
                <div class="vj-button-grid">
                    <button class="vj-button" data-control="changeColor">COLOR</button>
                    <button class="vj-button" data-control="cycleSpotMode">MODE</button>
                    <button class="vj-button" data-control="cyclePattern">PATTERN</button>
                </div>
                <div class="vj-slider-container">
                    <input type="range" class="vj-slider" id="spotSpeed" min="0.1" max="2.0" step="0.1" value="1.0" title="Adjust animation speed for all lighting effects">
                    <div class="vj-slider-label">
                        <span>Speed</span>
                        <span id="spotSpeedValue">1.0x</span>
                    </div>
                </div>
            </div>
            
            <!-- Mirror Ball Controls -->
            <div class="vj-section">
                <div class="vj-section-title">🪩 Mirror Ball</div>
                <button class="vj-button" data-control="changeMirrorBallColor">CHANGE COLOR</button>
            </div>
        </div>
    </div>
    
    <!-- Settings Toggle Button -->
    <button id="settingsToggle" title="Settings">⚙️</button>
    
    <!-- Settings Panel (hidden by default) -->
    <div id="settingsPanel">
        <div class="setting-label">🎮 VR Mode</div>
        <button id="vrButton">🥽 Enter VR</button>
        <div class="setting-label">🎵 Audio Stream</div>
        <input type="text" id="musicUrl" placeholder="Enter stream URL (https://...)">
        <button id="playMusicBtn">▶️ Play Music</button>
    </div>
    
    <!-- Audio Toggle Button -->
    <button id="audioToggle" title="Audio Stream">🎵</button>
    
    <!-- Audio Upload Menu -->
    <div id="audioMenu" class="hidden">
        <div class="audio-header">
            <div class="audio-title">
                <span>🎵</span>
                <span>Audio Stream</span>
            </div>
            <div class="audio-controls">
                <button class="audio-btn-icon" id="audioMinimize" title="Minimize">−</button>
                <button class="audio-btn-icon" id="audioClose" title="Close">×</button>
            </div>
        </div>
        
        <div class="audio-content">
            <!-- Stream URL -->
            <div class="audio-section">
                <div class="audio-input-group">
                    <input type="text" class="audio-input" id="streamUrl" placeholder="Paste stream URL (https://...)">
                    <button class="audio-button" id="playStreamBtn">
                        <span>▶️</span>
                        <span>Play</span>
                    </button>
                </div>
            </div>
            
            <!-- File Upload -->
            <div class="audio-section">
                <div class="audio-file-upload">
                    <label for="audioFileInput" class="audio-file-label">
                        📁 Choose Audio File
                    </label>
                    <input type="file" id="audioFileInput" class="audio-file-input" accept="audio/*">
                </div>
                <div id="audioFileName" class="audio-file-name"></div>
            </div>
            
            <!-- Status -->
            <div id="audioStatus" class="audio-status hidden"></div>
        </div>
    </div>
    
    <!-- Camera Controls -->
    <div id="cameraControls">
        <div class="preset-grid">
            <button data-camera-preset="exterior" title="Outside the club - exterior entrance view with neon sign">🌃 Outside</button>
            <button data-camera-preset="entrance" title="Front entrance view looking into club">🚪 Entry</button>
            <button data-camera-preset="danceFloor" title="Dance floor center, facing DJ booth">💃 Floor</button>
            <button data-camera-preset="djBooth" title="Behind DJ console, facing crowd">🎧 DJ</button>
            <button data-camera-preset="djSide" title="Side view of DJ booth and equipment">🎛️ DJ Side</button>
            <button data-camera-preset="ledWallClose" title="Close-up of LED wall video panels">🎨 LED</button>
            <button data-camera-preset="speakers" title="PA speaker stacks flanking LED wall">🔊 Speakers</button>
            <button data-camera-preset="truss" title="Lighting truss with moving heads">💡 Truss</button>
            <button data-camera-preset="mirrorBall" title="Disco mirror ball spotlight view">🪩 Ball</button>
            <button data-camera-preset="overview" title="Isometric view of entire club">🏢 Full</button>
            <button data-camera-preset="ceiling" title="Ceiling lasers and lighting">✨ Top</button>
        </div>
    </div>
    
    <!-- 3D Model Credits (CC BY License Attribution) -->
    <div id="modelCredits">
        <div class="credits-title">
            <strong>3D Models:</strong>
        </div>
        <div>
            • Pioneer DJ Console by 
            <a href="https://sketchfab.com/twopixels.studio" target="_blank" rel="noopener" class="credit-link">TwoPixels.studio</a>
            (CC BY 4.0)
        </div>
        <div>
            • PA Speakers (CC BY 4.0)
        </div>
    </div>
    
    <!-- Babylon.js Core - Critical Path -->
    <script src="https://cdn.babylonjs.com/babylon.js" crossorigin="anonymous"></script>
    <script src="https://cdn.babylonjs.com/proceduralTexturesLibrary/babylonjs.proceduralTextures.min.js" crossorigin="anonymous"></script>
    
    <!-- glTF Loader Plugin (REQUIRED for loading .glb 3D models) -->
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js" crossorigin="anonymous"></script>
    
    <!-- Texture Loader (loads before club script) -->
    <script src="js/textureLoader.js"></script>
    
    <!-- Model Loader (CDJs, Mixer, PA Speakers) -->
    <script src="js/modelLoader.js"></script>
    
    <!-- Material Factory (centralized material creation) -->
    <script src="js/materialFactory.js"></script>
    
    <!-- Light Factory (centralized light creation) -->
    <script src="js/lightFactory.js"></script>
    
    <!-- Lighting System Modules -->
    <script src="js/systems/laserSystem.js"></script>
    <script src="js/systems/spotlightSystem.js"></script>
    <script src="js/systems/mirrorBallSystem.js"></script>
    <script src="js/systems/ledWallSystem.js"></script>
    <script src="js/systems/strobeSystem.js"></script>
    <script src="js/systems/hazeSystem.js"></script>
    <script src="js/systems/vjControlSystem.js"></script>
    
    <!-- Multiplayer Networking and Avatar System (DISABLED) -->
    <!-- <script src="js/networkManager.js" defer></script> -->
    <!-- <script src="js/readyPlayerMeLoader.js" defer></script> -->
    <!-- <script src="js/avatarManager.js" defer></script> -->
    
    <!-- VR Club Main Application -->
    <script src="js/club_hyperrealistic.js"></script>
    
    <!-- UI Initialization (splash screen, VJ controls, audio, multiplayer) -->
    <script src="js/ui-init.js"></script>
</body>
</html>

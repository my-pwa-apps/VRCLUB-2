<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NOCTURNE WebXR Virtual Nightclub</title>
  <desc id="desc">A dark neon club preview with the NOCTURNE wordmark and cyan and magenta light beams.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset="0.55" stop-color="#071327"/>
      <stop offset="1" stop-color="#18051e"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15213a"/>
      <stop offset="1" stop-color="#03040a"/>
    </linearGradient>
    <filter id="cyanGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <path d="M0 630V390L600 300 1200 390V630Z" fill="url(#floor)"/>
  <path d="M112 60 490 630H370Z" fill="#1edff2" opacity=".12"/>
  <path d="M1088 60 710 630H830Z" fill="#f522b0" opacity=".12"/>
  <path d="M120 72 445 570" stroke="#43ecff" stroke-width="7" opacity=".72" filter="url(#cyanGlow)"/>
  <path d="M1080 72 755 570" stroke="#ff35bd" stroke-width="7" opacity=".7" filter="url(#pinkGlow)"/>
  <g transform="translate(86 184) scale(1.01)" fill="none" stroke="#8ff7ff" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter" filter="url(#cyanGlow)">
    <path d="M4.4 100V0L85.3 100V0M138.8 48A51.5 48.6 0 0 1 241.6 48M138.8 54A51.5 48.6 0 0 0 241.6 54M355.4 4.4H333.3A45.6 45.6 0 0 0 333.3 95.6H355.4M405.9 4.4H492.2M449.05 0V100M540.7 0V54.4A41.2 41.2 0 0 0 623.1 54.4V0M677.5 4.4H727A20.6 23.05 0 0 1 727 50.5H694.2M705.4 50.5L749.4 100M807.3 100V0L888.2 100V0M943.1 4.4H1016.6M943.1 50.5H1004.9M943.1 95.6H1016.6"/>
  </g>
  <text x="600" y="360" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="9" text-anchor="middle">WEBXR VIRTUAL NIGHTCLUB</text>
  <text x="600" y="414" fill="#b8cce7" font-family="Arial, sans-serif" font-size="25" letter-spacing="3" text-anchor="middle">VR HEADSETS  ·  DESKTOP  ·  MULTIPLAYER</text>
  <g opacity=".8">
    <rect x="230" y="504" width="740" height="4" rx="2" fill="#41e9f8"/>
    <rect x="330" y="529" width="540" height="3" rx="2" fill="#ff37b9"/>
  </g>
</svg>
